# Stage 2: Easy to medium problems with process rewards
include: grpo_process_rewards.yaml

curriculum:
  split: train
  max_problems: null
  difficulty_range: [1, 3]

training:
  use_self_consistency: true   # Must re-specify from parent
  use_process_rewards: true    # Must re-specify from parent
  num_generations: 16          # Must re-specify from parent
  temperature: 0.9             # Must re-specify from parent
  total_steps: 30000
  checkpoint_interval: 2000
