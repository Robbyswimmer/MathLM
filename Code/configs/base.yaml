# Shared defaults for MathLM experiments
data:
  split: train
  # source: huggingface  <-- Removed to avoid conflict
  # Optional: path to a local JSONL file to use as raw data
  # raw_file: data/processed/gsm8k_train_full.jsonl
  # Optional: path to a local Parquet file to convert
  parquet_file: data/gsm8k_raw/main/train-00000-of-00001.parquet
  source: parquet
prompting:
  shots: 0
  template: default
reward_weights:
  syntax: 0.0  # Removed - focus on correctness
  execution: 0.0  # Removed - focus on correctness
  extraction: 0.1  # Minimal - just to encourage number extraction
  reasoning: 0.2  # Minimal - encourage showing work
  exact: 10.0  # Massively increased - primary objective
  penalty: -2.0  # Increased penalty for wrong answers
training:
  model_name: models/gemma-2-2b-it
  batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-5
  kl_target: 0.08
  entropy_coef: 0.01
  checkpoint_interval: 2000  # Save every 2000 steps
  bf16: true
