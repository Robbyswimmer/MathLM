# Shared defaults for MathLM experiments
data:
  split: train
  # Optional: path to a local JSONL or Parquet file to use as raw data
  # raw_file: data/processed/gsm8k_train_full.jsonl
  parquet_file: data/gsm8k_raw/main/train-00000-of-00001.parquet
  source: parquet
prompting:
  shots: 0
  template: default
reward_weights:
  syntax: 0.2         # reward well-formed Python blocks
  execution: 0.2      # reward code that runs without errors
  extraction: 0.3     # reward extracting a numeric answer
  reasoning: 0.5      # reward showing reasoning steps
  exact: 2.0          # reward exact match on final answer
  penalty: -0.5       # penalize incorrect answers
training:
  model_name: models/gemma-2-2b-it
  batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-5
  kl_target: 0.02       # Relaxed from 0.005
  entropy_coef: 0.01    # Increased from 0.003 to encourage exploration
  kl_coef: 0.1          # stronger KL pressure
  checkpoint_interval: 50000   # Save every 50k steps
  total_steps: 500000          # Train for 500k steps
  bf16: true
