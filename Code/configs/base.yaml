# Shared defaults for MathLM experiments
data:
  split: train
  # Optional: path to a local JSONL or Parquet file to use as raw data
  # raw_file: data/processed/gsm8k_train_full.jsonl
  parquet_file: data/gsm8k_raw/main/train-00000-of-00001.parquet
  source: parquet
prompting:
  shots: 0
  template: default
reward_weights:
  syntax: 0.0         # No code, no syntax reward
  execution: 0.0      # No code, no execution reward
  extraction: 0.5     # Increased weight for finding an answer
  reasoning: 0.5      # Reward showing reasoning steps
  exact: 4.0          # Reward exact match on final answer
  penalty: -0.5       # Penalize incorrect answers
training:
  model_name: models/gemma-2-2b-it
  batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-5
  kl_target: 0.1        # Increased to prevent mode collapse
  entropy_coef: 0.01    # Encourage exploration
  kl_coef: 1.0          # Much stronger KL pressure to keep close to reference
  checkpoint_interval: 5000    # Save more frequently to recover from collapse
  total_steps: 500000          # Train for 500k steps
  bf16: true
