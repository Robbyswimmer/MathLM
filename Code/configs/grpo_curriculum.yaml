# GRPO configuration with curriculum learning and self-consistency
# This config trains progressively from easy to hard problems

include: grpo_base.yaml

# Override curriculum settings for progressive difficulty
curriculum:
  split: train  # Use full train split
  max_problems: null  # Use all problems (filtered by difficulty)

training:
  use_self_consistency: true  # Enable self-consistency voting reward
  total_steps: 40000           # Total training steps across all stages
  checkpoint_interval: 2000    # Save every 2k steps

# Curriculum stages - train easy problems first, then gradually add harder ones
# Stage 1: Difficulty 1-2 (Simple problems, ~2000 examples, 10k steps)
# Stage 2: Difficulty 1-3 (Add medium problems, ~4000 examples, 10k steps)
# Stage 3: Difficulty 1-4 (Add hard problems, ~6000 examples, 10k steps)
# Stage 4: Difficulty 1-5 (All problems, ~7500 examples, 10k steps)
